worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    resolver 127.0.0.11 valid=5s ipv6=off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_halo_session_id"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # No body size limit in Nginx - the upload size is verified by the receiver backend
    client_max_body_size 0;

    server {
        listen 80;
        server_name _;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        http2 on;
        server_name _;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Disable buffering to stream large session archives directly to the backend
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_http_version 1.1;

        proxy_connect_timeout 60s;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        location /halo-upload/v1/ {
            set $receiver_upstream receiver:8000;
            proxy_pass http://$receiver_upstream;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Pass protocol-specific HALO headers
            proxy_set_header Authorization $http_authorization;
            proxy_set_header X-HALO-Protocol-Version $http_x_halo_protocol_version;
            proxy_set_header X-HALO-Session-ID $http_x_halo_session_id;
            proxy_set_header X-HALO-Archive-SHA256 $http_x_halo_archive_sha256;
            proxy_set_header Idempotency-Key $http_idempotency_key;
        }

        location = /ui { return 302 https://$http_host/halo/; }
        location /ui/ { return 302 https://$http_host/halo/; }

        location /internal/ {
            return 404;
        }

        location / {
            set $pace_upstream pace-web:8000;
            proxy_pass http://$pace_upstream;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /healthz {
            return 200 '{"status":"ok","node":"sense"}\n';
            add_header Content-Type application/json;
        }
    }
}
