server {
    listen 80;
    server_name _;
    # Redirect all HTTP traffic to HTTPS (required for Geolocation API)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name _;

    # Self-signed cert for the Pi hotspot (see generate_cert.sh)
    ssl_certificate     /etc/nginx/certs/pace.crt;
    ssl_certificate_key /etc/nginx/certs/pace.key;

    # Proxy everything to the Django app — the Geolocation API needs
    # a secure context, so ALL pages (including admin pages) must be
    # served over HTTPS. Access control is handled by Django's auth.
    #
    # The amenities export makes a single Overpass API call that can
    # take over a minute on a slow network; the default 60s read
    # timeout cuts Gunicorn off mid-request and returns 504. Allow
    # up to 5 minutes to stay ahead of Gunicorn's --timeout 120.
    location / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}