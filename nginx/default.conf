server {
    listen 80;
    server_name _;

    # 1. Automatically redirect people typing the base URL (pace.local) to the survey lobby
    location = / {
        return 301 /surveys/;
    }

    # 2. Allow access to the survey lobby AND all sub-pages (/surveys/environment/, etc.)
    location /surveys/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Allow access to static files so your survey CSS/Images load properly
    location /static/ {
        proxy_pass http://web:8000;
    }
    
    location /media/ {
        proxy_pass http://web:8000;
    }

    # 4. Block access to absolutely everything else (Map tab, Dashboard, Admin)
    location / {
        return 403; # Returns a "403 Forbidden" error
    }
}