server {
    listen 80;
    server_name _;

    # 1. Automatically redirect people typing the base URL (pace.local) to the survey lobby
    location = / {
        return 301 /;
    }

    # 2. Allow access to the survey lobby AND all sub-pages
    location /surveys/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Allow login, logout, and account creation for surveyors
    location /login/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /logout/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 4. Allow access to static files so your survey CSS/Images load properly
    location /static/ {
        proxy_pass http://web:8000;
    }
    
    location /media/ {
        proxy_pass http://web:8000;
    }

    # 5. Block access to everything else (Map, Dashboard, Admin, create-user)
    #    These are admin-only and accessed directly via the Pi's IP:8000
    location / {
        return 403;
    }
}