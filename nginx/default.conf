server {
    listen 80;
    server_name _;

    # 1. Root path — the environmental survey is served directly at /
    location = / {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 2. Allow login, logout, and sign-up for participants
    location /login/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /logout/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    location /sign-up/ {
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 3. Allow access to static files so your survey CSS/Images load properly
    location /static/ {
        proxy_pass http://web:8000;
    }
    
    location /media/ {
        proxy_pass http://web:8000;
    }

    # 4. Block access to everything else (Map, Dashboard, Admin, create-user)
    #    These are admin-only and accessed directly via the Pi's IP:8000
    location / {
        return 403;
    }
}