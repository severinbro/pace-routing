{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    
    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">
    <link rel="stylesheet" href="{% static 'css/leaflet.css' %}">
    <link rel="stylesheet" href="{% static 'css/bootstrap-icons.min.css' %}">

    <script src="{% static 'js/leaflet.js' %}"></script>
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/chart.umd.js' %}"></script>
    
    <style>
        /* Custom Tablet-Friendly Styling */
        body { padding-top: 65px; }
        .nav-item { flex: 1; text-align: center; }
        .nav-link { font-size: 1.2rem; padding: 15px !important; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand navbar-dark bg-dark fixed-top shadow">
        <div class="navbar-nav w-100">

            {% if request.user.is_authenticated and request.user.is_staff %}
                <a class="nav-item nav-link {% if request.resolver_match.url_name == 'map_tab' %}active{% endif %}" href="{% url 'map_tab' %}">
                    <i class="bi bi-map"></i> Map
                </a>
                <a class="nav-item nav-link {% if request.resolver_match.url_name == 'dashboard_tab' %}active{% endif %}" href="{% url 'dashboard_tab' %}">
                    <i class="bi bi-clipboard-data"></i> Dashboard
                </a>
                <a class="nav-item nav-link" href="{% url 'admin:index' %}">
                    <i class="bi bi-database-fill"></i> Data
                </a>
            {% endif %}

            <a class="nav-item nav-link {% if 'survey' in request.resolver_match.url_name %}active{% endif %}" href="{% url 'surveys_tab' %}">
                <i class="bi bi-list-check"></i> Surveys
            </a>

            {% if request.user.is_authenticated and request.user.is_staff %}
                <a class="nav-item nav-link" href="{% url 'admin_logout' %}">
                    <i class="bi bi-box-arrow-right"></i> Sign Out
                </a>
            {% else %}
                <a class="nav-item nav-link {% if request.resolver_match.url_name == 'admin_login' %}active{% endif %}" href="{% url 'admin_login' %}">
                    <i class="bi bi-box-arrow-in-right"></i> Sign In
                </a>
            {% endif %}

        </div>
    </nav>

    <main class="container-fluid mt-3">
        {% block content %}{% endblock %}
    </main>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>
    <script src="{% static 'js/leaflet.js' %}"></script>
</body>
</html>
