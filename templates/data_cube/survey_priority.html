{% extends "base.html" %}

{% block content %}
<style>
    .slider-label { width: 40%; font-weight: bold; font-size: 1.1rem; }
    .form-range::-webkit-slider-thumb { background: #198754; height: 1.5rem; width: 1.5rem; }
</style>

<div class="container py-4">
    <div class="text-center mb-5">
        <h2 class="fw-bold"><i class="bi bi-trophy-fill"></i> Priority Comparison</h2>
        <p class="text-muted">Slide toward the feature that is more important to you.</p>
    </div>

    <form method="POST">
        {% csrf_token %}

        {% for pair in pairs %}
        <div class="card mb-4 shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <span class="slider-label text-start text-primary">{{ pair.a }}</span>
                    <span class="slider-label text-end text-success">{{ pair.b }}</span>
                </div>

                <input type="range" name="{{ pair.id }}" class="form-range" 
                       min="0" max="1" step="0.01" value="0.5">

                <div class="d-flex justify-content-between mt-2 text-muted small">
                    <span>Definitively {{ pair.a }}</span>
                    <span class="fw-bold">Neutral</span>
                    <span>Definitively {{ pair.b }}</span>
                </div>
            </div>
        </div>
        {% endfor %}

        <div class="d-grid gap-2 mt-5 mb-5">
            <button type="submit" class="btn btn-success btn-lg py-3 rounded-pill shadow">
                <i class="bi bi-file-check-fill"></i> Submit Priority Survey
            </button>
            <a href="{% url 'surveys_tab' %}" class="btn btn-link text-muted">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
