{% extends "base.html" %}
{% block content %}
<div class="container py-4">
    <div class="text-center mb-4">
        <h1 class="fw-bold">PACE Control</h1>
        <p class="text-muted">Choose the platform you want to work with.</p>
    </div>
    <div class="row g-4 mx-auto" style="max-width: 1000px;">
        <div class="col-md-6">
            <a href="{% url 'sense_home' %}" class="pace-card pace-card-hover d-block p-4 h-100 text-decoration-none text-dark">
                <div class="pace-icon-tile pace-icon-tile-mint mb-3"><i class="bi bi-cpu"></i></div>
                <h2>SENSE</h2>
                <p class="text-muted mb-0">Environmental sensors, survey campaigns, map and collected data.</p>
            </a>
        </div>
        <div class="col-md-6">
            <a href="{% url 'halo_home' %}" class="pace-card pace-card-hover d-block p-4 h-100 text-decoration-none text-dark">
                <div class="pace-icon-tile pace-icon-tile-coral mb-3"><i class="bi bi-camera-video"></i></div>
                <h2>HALO</h2>
                <p class="text-muted mb-0">Recording control, sensor readiness, synchronization and transfer to SENSE.</p>
            </a>
        </div>
    </div>
</div>
{% endblock %}
