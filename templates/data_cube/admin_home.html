{% extends "base.html" %}
{% block content %}
<div class="text-center mt-4">
    <h2 class="fw-bold">Admin Home</h2>
    <p class="text-muted">Signed in as <strong>{{ request.user.username }}</strong>.</p>
</div>

<div class="d-grid gap-4 col-lg-8 mx-auto mt-5">
    <a href="{% url 'dashboard_tab' %}" class="btn btn-outline-primary btn-lg p-5 rounded-4 shadow-sm text-start">
        <div class="d-flex align-items-center">
            <div class="display-4 me-4"><i class="bi bi-clipboard-data"></i></div>
            <div>
                <h3 class="mb-1">Dashboard</h3>
                <p class="mb-0 opacity-75">Live sensor telemetry grid.</p>
            </div>
        </div>
    </a>

    <a href="{% url 'map_tab' %}" class="btn btn-outline-info btn-lg p-5 rounded-4 shadow-sm text-start">
        <div class="d-flex align-items-center">
            <div class="display-4 me-4"><i class="bi bi-map"></i></div>
            <div>
                <h3 class="mb-1">Map</h3>
                <p class="mb-0 opacity-75">Offline OSM map with live position.</p>
            </div>
        </div>
    </a>

    <a href="{% url 'admin:index' %}" class="btn btn-outline-secondary btn-lg p-5 rounded-4 shadow-sm text-start">
        <div class="d-flex align-items-center">
            <div class="display-4 me-4"><i class="bi bi-database-fill"></i></div>
            <div>
                <h3 class="mb-1">Data</h3>
                <p class="mb-0 opacity-75">Browse database tables &amp; export GPKG.</p>
            </div>
        </div>
    </a>
</div>

<div class="text-center mt-5 mb-5">
    <a href="{% url 'admin_logout' %}" class="btn btn-link text-muted">
        <i class="bi bi-box-arrow-right"></i> Sign Out
    </a>
</div>
{% endblock %}
